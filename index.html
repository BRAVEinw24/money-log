<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money Log — iOS Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Client-Side On-Device OCR (100% Free - No Google Cloud Billing Required) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1C1C1E;
      --card-secondary: #2C2C2E;
      --card-tertiary: #3A3A3C;
      --border: rgba(255, 255, 255, 0.09);
      --border-focus: #0A84FF;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --text-tertiary: #636366;
      --ios-blue: #0A84FF;
      --ios-red: #FF453A;
      --ios-green: #30D158;
      --ios-orange: #FF9F0A;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 40px);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding-top: 16px;
    }

    /* iOS Navigation Bar */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ios-blue);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .sync-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--ios-green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ios-green);
      box-shadow: 0 0 8px var(--ios-green);
    }

    /* iOS Segmented Control */
    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      position: relative;
    }

    .segment-btn {
      padding: 10px 0;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: none;
    }

    .segment-btn.active.expense {
      background: rgba(255, 69, 58, 0.16);
      color: var(--ios-red);
      border: 1px solid rgba(255, 69, 58, 0.3);
      box-shadow: 0 2px 8px rgba(255, 69, 58, 0.2);
    }

    .segment-btn.active.income {
      background: rgba(48, 209, 88, 0.16);
      color: var(--ios-green);
      border: 1px solid rgba(48, 209, 88, 0.3);
      box-shadow: 0 2px 8px rgba(48, 209, 88, 0.2);
    }

    /* iOS Grouped Card */
    .ios-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    .ios-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .ios-input, .ios-select {
      width: 100%;
      background: var(--card-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-family: var(--font-family);
      outline: none;
      transition: none;
    }

    .ios-input:focus, .ios-select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 1px var(--border-focus);
      background: #333336;
    }

    .ios-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      cursor: pointer;
    }

    /* iOS Upload Zone */
    .upload-zone {
      border: 1.5px dashed var(--card-tertiary);
      background: rgba(44, 44, 46, 0.4);
      border-radius: 16px;
      padding: 26px 16px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: none;
    }

    .upload-zone:hover {
      border-color: var(--ios-blue);
      background: rgba(10, 132, 255, 0.05);
    }

    .upload-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ios-blue);
    }

    .upload-text strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .upload-text span {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .upload-zone input {
      display: none;
    }

    .file-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--card-secondary);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--ios-blue);
      margin-top: 12px;
      word-break: break-all;
    }

    .file-badge.active {
      display: flex;
    }

    /* iOS Action Buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .ios-btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-family);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: none;
    }

    .btn-secondary {
      background: var(--card-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--card-tertiary);
    }

    .btn-primary {
      background: var(--ios-blue);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(10, 132, 255, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-success {
      background: var(--ios-green);
      color: #000000;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(48, 209, 88, 0.3);
    }

    /* Verification Card (Apple Wallet style) */
    .preview-card {
      display: none;
    }

    .preview-card.show {
      display: block;
    }

    .amount-display-container {
      background: var(--card-secondary);
      border-radius: 16px;
      padding: 20px 16px;
      margin: 14px 0 18px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .amount-sublabel {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .amount-input-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .currency-symbol {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .amount-input-large {
      background: transparent;
      border: none;
      font-size: 38px;
      font-weight: 800;
      color: var(--text-primary);
      width: 220px;
      text-align: center;
      font-family: var(--font-family);
      outline: none;
    }

    /* Detected Candidates Quick-Pick Pills */
    .candidates-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .candidates-title {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .candidates-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .candidate-pill {
      background: var(--card-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: none;
    }

    .candidate-pill:hover, .candidate-pill.active {
      background: rgba(10, 132, 255, 0.2);
      border-color: var(--ios-blue);
      color: var(--ios-blue);
    }

    /* Status Notifications */
    .status-box {
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 12px;
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .status-box.show {
      display: flex;
    }

    .status-box.ok {
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.25);
      color: var(--ios-green);
    }

    .status-box.error {
      background: rgba(255, 69, 58, 0.12);
      border: 1px solid rgba(255, 69, 58, 0.25);
      color: var(--ios-red);
    }

    .status-box.info {
      background: rgba(10, 132, 255, 0.12);
      border: 1px solid rgba(10, 132, 255, 0.25);
      color: var(--ios-blue);
    }

    /* iOS Inset Footer */
    .ios-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .ios-footer a {
      color: var(--ios-blue);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- Top Navigation Header -->
    <header class="nav-bar">
      <div class="brand-group">
        <div class="app-icon">
          <i data-lucide="wallet-cards"></i>
        </div>
        <div class="brand-text">
          <h1>Money Log</h1>
          <p>Google Drive & Sheets Vault</p>
        </div>
      </div>
      <div class="sync-status-badge">
        <span class="status-dot"></span>
        <span id="connection">Free OCR Active</span>
      </div>
    </header>

    <!-- Expense / Income Segmented Control -->
    <div class="segmented-control">
      <button id="expense" class="segment-btn active expense">
        <i data-lucide="arrow-up-right" style="width: 18px; height: 18px;"></i> Expense
      </button>
      <button id="income" class="segment-btn income">
        <i data-lucide="arrow-down-left" style="width: 18px; height: 18px;"></i> Income
      </button>
    </div>

    <!-- Main Entry Card -->
    <section class="ios-card">
      <div class="ios-card-title">
        <i data-lucide="layers" style="width: 16px; height: 16px;"></i> Transaction Details
      </div>

      <div class="form-group">
        <label class="form-label" for="category">Category</label>
        <select id="category" class="ios-select">
          <option value="Food">🍽️ Food & Dining</option>
          <option value="Transport">🚗 Transportation</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Bills">⚡ Utilities & Bills</option>
          <option value="Health">💊 Health & Medical</option>
          <option value="Home">🏠 Home & Living</option>
          <option value="Education">📚 Books & Learning</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Investments">📈 Stock & Investments</option>
          <option value="Salary">💼 Salary / Income</option>
          <option value="Other">✨ Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Receipt / Slip Upload</label>
        <label class="upload-zone" for="slip">
          <div class="upload-icon-circle">
            <i data-lucide="camera" style="width: 24px; height: 24px;"></i>
          </div>
          <div class="upload-text">
            <strong>Choose Slip or Receipt Image</strong>
            <span>100% Free on-device OCR — no cloud billing required</span>
          </div>
          <input id="slip" type="file" accept="image/*,.pdf">
        </label>
        <div class="file-badge" id="fileName">
          <i data-lucide="file-check" style="width: 16px; height: 16px;"></i>
          <span id="fileNameText"></span>
        </div>
      </div>

      <div class="btn-row">
        <button class="ios-btn btn-secondary" id="manual-entry">
          <i data-lucide="edit-3" style="width: 16px; height: 16px;"></i> Enter Manually
        </button>
        <button class="ios-btn btn-primary" id="scan" disabled>
          <i data-lucide="scan" style="width: 18px; height: 18px;"></i> Read Amount
        </button>
      </div>

      <div id="status" class="status-box"></div>
    </section>

    <!-- Confirmation / Review Card -->
    <section class="ios-card preview-card" id="preview">
      <div class="ios-card-title">
        <i data-lucide="check-circle-2" style="width: 16px; height: 16px; color: var(--ios-green);"></i> Confirm Record
      </div>

      <div class="amount-display-container">
        <div class="amount-sublabel">Detected Amount (Editable)</div>
        <div class="amount-input-wrapper">
          <span class="currency-symbol">฿</span>
          <input id="amount" class="amount-input-large" type="number" min="0" step="0.01" placeholder="0.00">
        </div>

        <!-- Quick Pick Candidate Pills -->
        <div class="candidates-section" id="candidatesSection" style="display:none;">
          <div class="candidates-title">Tap to switch to another detected amount:</div>
          <div class="candidates-row" id="candidatesList"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description (Optional)</label>
        <input id="description" class="ios-input" placeholder="e.g. 7-Eleven, Starbucks, Grab, PromptPay">
      </div>

      <div class="form-group">
        <label class="form-label" for="date">Transaction Date</label>
        <input id="date" class="ios-input" type="date">
      </div>

      <div class="btn-row">
        <button class="ios-btn btn-secondary" id="reset-all">
          <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i> Clear
        </button>
        <button class="ios-btn btn-success" id="save">
          <i data-lucide="cloud-upload" style="width: 18px; height: 18px;"></i> Confirm & Save
        </button>
      </div>

      <div id="saveStatus" class="status-box"></div>
    </section>

    <!-- iOS Inset Footer Info -->
    <footer class="ios-footer">
      <p>Free On-Device OCR + Google Drive Receipt Storage & Sheets Ledger.</p>
      <a href="/api/health" target="_blank">View Live API Diagnostic ↗</a>
    </footer>

  </div>

  <script>
    lucide.createIcons();

    let type = 'expense';
    let file = null;

    const $ = s => document.querySelector(s);
    const today = new Date().toISOString().slice(0, 10);
    $('#date').value = today;

    function setType(t) {
      type = t;
      $('#expense').classList.toggle('active', t === 'expense');
      $('#income').classList.toggle('active', t === 'income');
    }

    $('#expense').onclick = () => setType('expense');
    $('#income').onclick = () => setType('income');

    $('#slip').onchange = e => {
      file = e.target.files[0] || null;
      $('#scan').disabled = !file;
      if (file) {
        $('#fileNameText').textContent = file.name;
        $('#fileName').classList.add('active');
      } else {
        $('#fileName').classList.remove('active');
      }
      hideStatus('#status');
    };

    function showStatus(selector, text, mode) {
      const el = $(selector);
      el.className = `status-box show ${mode}`;
      let iconName = mode === 'ok' ? 'check-circle' : mode === 'error' ? 'alert-circle' : 'loader-2';
      el.innerHTML = `<i data-lucide="${iconName}" style="width:18px; height:18px; flex-shrink:0;"></i> <span>${text}</span>`;
      lucide.createIcons();
    }

    function hideStatus(selector) {
      const el = $(selector);
      el.className = 'status-box';
      el.innerHTML = '';
    }

    // High-Precision Thai/English Slip Amount Parser
    function parseAmountCandidates(text) {
      const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      const candidates = [];

      // Strong amount keywords in Thai and English
      const amountKeywords = /(?:จำนวนเงิน|ยอดเงิน|ยอดชำระ|รวมทั้งสิ้น|ยอดรวม|โอนเงิน|ค่าสินค้า|amount|total|net|sum|price|paid)/i;
      // Metadata to ignore/penalize (Ref ID, Account Number, Phone, Date, Time, Fee)
      const metaKeywords = /(?:ref|รหัสอ้างอิง|เลขที่รายการ|เลขที่บัญชี|account|acc|trans|txn|fee|ค่าธรรมเนียม|เบอร์|tel|phone|time)/i;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const prevLine = i > 0 ? lines[i - 1] : '';
        const nextLine = i < lines.length - 1 ? lines[i + 1] : '';

        // Skip lines that are purely reference codes or account numbers
        if (metaKeywords.test(line) && !amountKeywords.test(line)) {
          continue;
        }

        // Clean tokens matching numbers with or without decimals (e.g. 18.00, 18, 1,500.00)
        // Lookaround ensures it's NOT part of an account number like xxx-5500-1 or date/time like 22:40:18
        const tokens = line.match(/(?<![\w\-:/.])(?:\d{1,3}(?:,\d{3})*|\d+)(?:\.\d{1,2})?(?![\w\-:/.])/g) || [];

        for (const token of tokens) {
          const cleanNum = token.replace(/,/g, '');
          const n = parseFloat(cleanNum);

          // Skip zero, invalid numbers, or absurdly large numbers (> 1,000,000)
          if (isNaN(n) || n <= 0 || n >= 1000000) continue;

          // Exclude calendar years (2020-2035 or Thai years 2560-2575) if no decimals
          if (!token.includes('.') && ((n >= 2020 && n <= 2035) || (n >= 2560 && n <= 2575))) {
            continue;
          }

          const hasDecimals = /\.\d{2}$/.test(token);
          let score = 0;

          // Strongest signal: on or adjacent to "จำนวนเงิน" or "Amount"
          if (amountKeywords.test(line)) score += 60;
          if (amountKeywords.test(prevLine)) score += 50;

          // Currency symbols (บาท, THB, ฿)
          if (/(?:บาท|thb|฿)/i.test(line)) score += 35;
          if (/(?:บาท|thb|฿)/i.test(nextLine)) score += 20;

          // Thai slips almost always have two decimal places (e.g. 18.00)
          if (hasDecimals) {
            score += 30;
          } else {
            // Whole integers without decimals get penalized to avoid account fragments
            score -= 15;
          }

          candidates.push({
            n,
            raw: token,
            score,
            hasDecimals,
            line
          });
        }
      }

      // Deduplicate by number value, preserving highest score
      const map = new Map();
      for (const c of candidates) {
        if (!map.has(c.n) || map.get(c.n).score < c.score) {
          map.set(c.n, c);
        }
      }

      // Sort: highest score first; if tied, decimals first, then smaller/realistic price first
      const sorted = Array.from(map.values()).sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        if (b.hasDecimals !== a.hasDecimals) return b.hasDecimals ? 1 : -1;
        return a.n - b.n;
      });

      return sorted;
    }

    // Client-side OCR via Tesseract.js
    $('#scan').onclick = async () => {
      if (!file) return;
      $('#scan').disabled = true;
      showStatus('#status', 'Scanning slip on-device… (0%)', 'info');

      try {
        const result = await Tesseract.recognize(
          file,
          'eng',
          {
            logger: m => {
              if (m.status === 'recognizing text') {
                const pct = Math.round((m.progress || 0) * 100);
                showStatus('#status', `Scanning slip on-device (${pct}%)…`, 'info');
              }
            }
          }
        );

        const extractedText = result?.data?.text || '';
        const candidates = parseAmountCandidates(extractedText);

        const candidatesSection = $('#candidatesSection');
        const candidatesList = $('#candidatesList');
        candidatesList.innerHTML = '';

        if (candidates.length > 0) {
          const topChoice = candidates[0].n;
          $('#amount').value = topChoice;
          showStatus('#status', `Detected ฿${topChoice}! Verify or tap an alternative below.`, 'ok');

          // Render quick pick pills if multiple numbers were found
          if (candidates.length > 1) {
            candidatesSection.style.display = 'block';
            candidates.slice(0, 5).forEach((cand, idx) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = `candidate-pill ${idx === 0 ? 'active' : ''}`;
              btn.textContent = `฿${cand.n.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
              btn.onclick = () => {
                $('#amount').value = cand.n;
                document.querySelectorAll('.candidate-pill').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
              };
              candidatesList.appendChild(btn);
            });
          } else {
            candidatesSection.style.display = 'none';
          }
        } else {
          candidatesSection.style.display = 'none';
          showStatus('#status', 'Could not automatically isolate the total. Please type the amount below.', 'info');
        }

        $('#preview').classList.add('show');
        $('#preview').scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        console.error('OCR error:', err);
        showStatus('#status', 'OCR could not process image. Please enter amount manually below.', 'error');
        $('#preview').classList.add('show');
      } finally {
        $('#scan').disabled = false;
      }
    };

    // Manual Entry fallback
    $('#manual-entry').onclick = () => {
      $('#preview').classList.add('show');
      $('#preview').scrollIntoView({ behavior: 'smooth' });
      $('#amount').focus();
    };

    // Save to Google Drive and Google Sheets
    $('#save').onclick = async () => {
      const amount = Number($('#amount').value);
      if (!amount || amount <= 0) {
        return showStatus('#saveStatus', 'Please enter a valid amount greater than 0.', 'error');
      }

      $('#save').disabled = true;
      showStatus('#saveStatus', 'Uploading to Google Drive & logging to Google Sheet…', 'info');

      const fd = new FormData();
      if (file) fd.append('receipt', file);
      fd.append('amount', amount);
      fd.append('type', type);
      fd.append('category', $('#category').value);
      fd.append('description', $('#description').value);
      fd.append('date', $('#date').value);

      try {
        const r = await fetch('/api/record', { method: 'POST', body: fd });
        const d = await r.json();
        if (!r.ok) throw Error(d.error || 'Failed to save transaction');

        showStatus('#saveStatus', `Saved successfully! Added to Google Sheet row ${d.rowNumber || ''}.`, 'ok');
      } catch (e) {
        showStatus('#saveStatus', e.message, 'error');
      } finally {
        $('#save').disabled = false;
      }
    };

    function clearAll() {
      file = null;
      $('#slip').value = '';
      $('#fileName').classList.remove('active');
      $('#scan').disabled = true;
      $('#amount').value = '';
      $('#description').value = '';
      $('#candidatesSection').style.display = 'none';
      $('#candidatesList').innerHTML = '';
      $('#preview').classList.remove('show');
      hideStatus('#status');
      hideStatus('#saveStatus');
    }

    $('#reset-all').onclick = clearAll;
  </script>
</body>
</html>
